[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "1.0.0"
description = "Authorized network reconnaissance and vulnerability triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maximilian Jatzkowski" }]
keywords = ["security", "nmap", "pentest", "reconnaissance", "vulnerability"]
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
ui = ["flask>=2.3"]
cli = ["rich>=13"]

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vantage", "vantage.web"]

[tool.setuptools.package-data]
vantage = ["templates/*.j2", "knowledge/*.json", "web/templates/*.html", "web/static/*.css"]
